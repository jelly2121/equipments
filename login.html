<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Equipment Borrowing - Login
    </title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <div class="login-container">

        <div class="login-card">


            <!-- TITLE -->

            <h1>
                Equipment Borrowing
            </h1>


            <p class="subtitle">
                College Equipment Management System
            </p>



            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="btn-primary">

                    Login

                </button>


            </form>



            <!-- MESSAGE -->

            <p id="loginMessage"></p>


        </div>

    </div>



    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>



    <!-- YOUR SUPABASE CONFIG -->

    <script src="js/supabase.js"></script>



    <!-- LOGIN SCRIPT -->

    <script src="js/auth.js"></script>


</body>

</html>
